<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="board-wrap" aria-label="Chess board">
            <div class="rank-labels left">
                <span>8</span><span>7</span><span>6</span><span>5</span>
                <span>4</span><span>3</span><span>2</span><span>1</span>
            </div>

            <div class="chess-board">
                <div class="square light black-piece">&#9820;</div>
                <div class="square dark black-piece">&#9822;</div>
                <div class="square light black-piece">&#9821;</div>
                <div class="square dark black-piece">&#9819;</div>
                <div class="square light black-piece">&#9818;</div>
                <div class="square dark black-piece">&#9821;</div>
                <div class="square light black-piece">&#9822;</div>
                <div class="square dark black-piece">&#9820;</div>

                <div class="square dark black-piece">&#9823;</div>
                <div class="square light black-piece">&#9823;</div>
                <div class="square dark black-piece">&#9823;</div>
                <div class="square light black-piece">&#9823;</div>
                <div class="square dark black-piece">&#9823;</div>
                <div class="square light black-piece">&#9823;</div>
                <div class="square dark black-piece">&#9823;</div>
                <div class="square light black-piece">&#9823;</div>

                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>

                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>

                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>

                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>
                <div class="square dark"></div>
                <div class="square light"></div>

                <div class="square light white-piece">&#9817;</div>
                <div class="square dark white-piece">&#9817;</div>
                <div class="square light white-piece">&#9817;</div>
                <div class="square dark white-piece">&#9817;</div>
                <div class="square light white-piece">&#9817;</div>
                <div class="square dark white-piece">&#9817;</div>
                <div class="square light white-piece">&#9817;</div>
                <div class="square dark white-piece">&#9817;</div>

                <div class="square dark white-piece">&#9814;</div>
                <div class="square light white-piece">&#9816;</div>
                <div class="square dark white-piece">&#9815;</div>
                <div class="square light white-piece">&#9813;</div>
                <div class="square dark white-piece">&#9812;</div>
                <div class="square light white-piece">&#9815;</div>
                <div class="square dark white-piece">&#9816;</div>
                <div class="square light white-piece">&#9814;</div>
            </div>

            <div class="rank-labels right">
                <span>8</span><span>7</span><span>6</span><span>5</span>
                <span>4</span><span>3</span><span>2</span><span>1</span>
            </div>

            <div class="file-labels">
                <span>a</span><span>b</span><span>c</span><span>d</span>
                <span>e</span><span>f</span><span>g</span><span>h</span>
            </div>

</html>
